version: "3.9"

services:

  barcode_nowindow:
    image: barcode_nowindow:v1
    build: .

    container_name: barcode_nowindow

    privileged: true

    network_mode: host
    
    stdin_open: true

    tty: true

    restart: "no"

    environment:
      - DISPLAY=${DISPLAY}
      
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /run/dbus:/run/dbus

    devices:
      - /dev/video0
   
